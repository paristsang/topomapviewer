<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Mobile Topo Viewer with GPS and Local Map Catalog</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            background: #f4f4f4;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* ================================
           FLOATING TOOLS BUTTON
        ================================= */

        .tools-fab {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 1001;
            border: none;
            background: #2c3e50;
            color: white;
            padding: 13px 22px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            touch-action: manipulation;
        }

        .tools-fab:active {
            transform: translateX(-50%) scale(0.96);
        }

        .tools-backdrop {
            position: absolute;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.22);
            display: none;
        }

        .tools-backdrop.open {
            display: block;
        }

        /* ================================
           BOTTOM TOOLS SHEET
        ================================= */

        .tools-sheet {
            position: absolute;
            left: 50%;
            bottom: 14px;
            transform: translate(-50%, calc(100% + 30px));
            z-index: 1002;
            width: calc(100vw - 24px);
            max-width: 430px;
            background: rgba(255, 255, 255, 0.98);
            padding: 12px;
            border-radius: 18px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.32);
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition:
                transform 0.24s ease,
                opacity 0.24s ease;
        }

        .tools-sheet.open {
            transform: translate(-50%, 0);
            opacity: 1;
            pointer-events: auto;
        }

        .tools-sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tools-sheet-header strong {
            font-size: 15px;
            color: #111;
        }

        .tools-close-btn {
            border: none;
            background: #eeeeee;
            color: #333;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            font-size: 22px;
            line-height: 28px;
            cursor: pointer;
        }

        #status {
            font-weight: bold;
            color: #2980b9;
            font-size: 12px;
            line-height: 1.35;
        }

        #gpsInfo {
            font-size: 11px;
            color: #444;
            line-height: 1.35;
            background: #f5f7f8;
            border-radius: 8px;
            padding: 7px;
            display: none;
            white-space: pre-line;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .app-btn {
            color: white;
            border: none;
            padding: 9px 8px;
            border-radius: 11px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            min-height: 44px;
            touch-action: manipulation;
            transition:
                background 0.2s ease,
                transform 0.1s ease,
                opacity 0.2s ease;
        }

        .app-btn:active {
            transform: scale(0.98);
        }

        .app-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gps-btn {
            background-color: #2ecc71;
            font-size: 15px;
            min-height: 48px;
        }

        .follow-btn {
            background-color: #3498db;
        }

        .follow-btn.active {
            background-color: #1f618d;
        }

        .nearest-btn {
            background-color: #8e44ad;
        }

        .overlay-btn {
            background-color: #34495e;
        }

        .track-btn {
            background-color: #e67e22;
        }

        .export-btn {
            background-color: #16a085;
        }

        .opacity-wrapper {
            display: none;
            background: #f5f7f8;
            border-radius: 8px;
            padding: 8px;
            font-size: 12px;
            color: #333;
        }

        .opacity-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #opacitySlider {
            width: 100%;
            accent-color: #2980b9;
        }

        #opacityValue {
            min-width: 36px;
            text-align: right;
            font-weight: bold;
        }

        /* ================================
           LEAFLET CONTROLS
        ================================= */

        .leaflet-control-layers {
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
            font-size: 14px;
        }

        .leaflet-control-zoom a {
            width: 36px;
            height: 36px;
            line-height: 36px;
        }

        .leaflet-bottom.leaflet-left {
            bottom: 72px;
        }

        .leaflet-bottom.leaflet-right {
            bottom: 72px;
        }

        /* ================================
           LOCAL MAP CATALOG CONTROL
        ================================= */

        .local-map-control {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .local-map-toggle {
            width: 38px;
            height: 38px;
            border: none;
            background: #ffffff;
            cursor: pointer;
            font-size: 20px;
            line-height: 38px;
            text-align: center;
        }

        .local-map-panel {
            display: none;
            width: 280px;
            max-height: 360px;
            padding: 10px;
            box-sizing: border-box;
        }

        .local-map-control.expanded .local-map-toggle {
            display: none;
        }

        .local-map-control.expanded .local-map-panel {
            display: block;
        }

        .local-map-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .local-map-close {
            border: none;
            background: #eeeeee;
            border-radius: 6px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            font-size: 16px;
        }

        .local-map-search {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 7px;
            padding: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .local-map-list {
            max-height: 255px;
            overflow-y: auto;
            border-top: 1px solid #eeeeee;
        }

        .local-map-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 2px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.25;
        }

        .local-map-item:hover {
            background: #f5f7f8;
        }

        .local-map-item input {
            flex: 0 0 auto;
        }

        .local-map-empty {
            color: #777777;
            font-size: 13px;
            padding: 8px 0;
        }

        /* ================================
           USER LOCATION MARKER
        ================================= */

        .user-heading-marker {
            width: 32px;
            height: 32px;
            transform-origin: center;
        }

        .user-heading-arrow {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 24px solid #e74c3c;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
            margin-left: 7px;
        }

        .user-heading-dot {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border: 3px solid #e74c3c;
            border-radius: 50%;
            margin-left: 7px;
            margin-top: -4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        }

        /* ================================
           DESKTOP ADJUSTMENTS
        ================================= */

        @media (min-width: 701px) {
            .tools-fab {
                left: auto;
                right: 20px;
                bottom: 20px;
                transform: none;
            }

            .tools-fab:active {
                transform: scale(0.96);
            }

            .tools-sheet {
                left: auto;
                right: 20px;
                bottom: 78px;
                transform: translateY(20px);
                width: 330px;
            }

            .tools-sheet.open {
                transform: translateY(0);
            }
        }

        /* ================================
           MOBILE ADJUSTMENTS
        ================================= */

        @media (max-width: 700px) {
            .leaflet-top.leaflet-right {
                top: 8px;
                right: 8px;
            }

            .leaflet-control-layers {
                max-width: calc(100vw - 80px);
                font-size: 13px;
            }

            .leaflet-control-zoom {
                margin-top: 8px;
                margin-left: 8px;
            }

            .local-map-panel {
                width: min(310px, calc(100vw - 70px));
                max-height: 320px;
            }

            .local-map-list {
                max-height: 220px;
            }
        }
    </style>
</head>

<body>
    <button id="toolsFab" class="tools-fab" type="button">
        🧰 Tools
    </button>

    <div id="toolsBackdrop" class="tools-backdrop"></div>

    <div id="ui-container" class="tools-sheet">
        <div class="tools-sheet-header">
            <strong>GPS & Field Tools</strong>
            <button id="closeToolsBtn" class="tools-close-btn" type="button">×</button>
        </div>

        <div id="status">Connecting to folder...</div>

        <div id="gpsInfo"></div>

        <button class="app-btn gps-btn full-width" id="gpsBtn" type="button">
            📍 Find My Location
        </button>

        <div class="button-grid">
            <button class="app-btn follow-btn" id="followBtn" type="button" disabled>
                🧭 Follow: Off
            </button>

            <button class="app-btn nearest-btn" id="nearestBtn" type="button" disabled>
                📌 Nearest Map
            </button>

            <button class="app-btn overlay-btn" id="overlayBtn" type="button" disabled>
                🗺 Hide Map
            </button>

            <button class="app-btn track-btn" id="trackBtn" type="button" disabled>
                ▶ Start Track
            </button>

            <button class="app-btn export-btn full-width" id="exportBtn" type="button" disabled>
                💾 Export GPX
            </button>
        </div>

        <div class="opacity-wrapper" id="opacityWrapper">
            <div class="opacity-row">
                <span>Overlay</span>
                <input
                    id="opacitySlider"
                    type="range"
                    min="0"
                    max="100"
                    value="85"
                    step="5"
                />
                <span id="opacityValue">85%</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // MAP INITIALIZATION
        // ==========================================

        const map = L.map("map", {
            zoomControl: false
        }).setView([0, 0], 2);

        L.control.zoom({
            position: "topleft"
        }).addTo(map);

        L.control.scale({
            imperial: false,
            metric: true,
            position: "bottomleft"
        }).addTo(map);

        // ==========================================
        // BASE MAP OPTIONS
        // ==========================================

        const osmStandard = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "© OpenStreetMap contributors"
            }
        );

        const osmHot = L.tileLayer(
            "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "© OpenStreetMap contributors, Tiles style by Humanitarian OpenStreetMap Team"
            }
        );

        const openTopoMap = L.tileLayer(
            "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 17,
                attribution:
                    "© OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap"
            }
        );

        const baseMaps = {
            "OpenStreetMap Standard": osmStandard,
            "OpenStreetMap HOT": osmHot,
            "OpenStreetMap Outdoor / Topographic": openTopoMap
        };

        osmStandard.addTo(map);

        const isMobile = window.matchMedia("(max-width: 700px)").matches;

        L.control.layers(baseMaps, null, {
            collapsed: isMobile,
            position: "topright"
        }).addTo(map);

        // ==========================================
        // LOCAL MAP CATALOG CONTROL
        // ==========================================

        const localMapCatalogControl = createLocalMapCatalogControl();
        localMapCatalogControl.addTo(map);

        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const toolsFab = document.getElementById("toolsFab");
        const toolsSheet = document.getElementById("ui-container");
        const toolsBackdrop = document.getElementById("toolsBackdrop");
        const closeToolsBtn = document.getElementById("closeToolsBtn");

        const statusEl = document.getElementById("status");
        const gpsInfoEl = document.getElementById("gpsInfo");
        const gpsBtn = document.getElementById("gpsBtn");
        const followBtn = document.getElementById("followBtn");
        const nearestBtn = document.getElementById("nearestBtn");
        const overlayBtn = document.getElementById("overlayBtn");
        const trackBtn = document.getElementById("trackBtn");
        const exportBtn = document.getElementById("exportBtn");
        const opacityWrapper = document.getElementById("opacityWrapper");
        const opacitySlider = document.getElementById("opacitySlider");
        const opacityValue = document.getElementById("opacityValue");

        // ==========================================
        // UI EVENTS
        // ==========================================

        toolsFab.addEventListener("click", openToolsPanel);
        closeToolsBtn.addEventListener("click", closeToolsPanel);
        toolsBackdrop.addEventListener("click", closeToolsPanel);

        gpsBtn.addEventListener("click", toggleGPS);
        followBtn.addEventListener("click", toggleFollowMode);
        nearestBtn.addEventListener("click", openNearestMapToUser);
        overlayBtn.addEventListener("click", toggleCurrentOverlayVisibility);
        trackBtn.addEventListener("click", toggleTrackRecording);
        exportBtn.addEventListener("click", exportGPX);

        opacitySlider.addEventListener("input", function () {
            const value = Number(opacitySlider.value);
            currentOverlayOpacity = value / 100;
            opacityValue.innerText = `${value}%`;

            if (currentOverlay) {
                currentOverlay.setOpacity(currentOverlayOpacity);
            }
        });

        map.on("dragstart", function () {
            if (isFollowingUser) {
                setFollowMode(false);
            }
        });

        map.on("zoomend", updateCoverageStylesByZoom);

        // ==========================================
        // APP STATE
        // ==========================================

        let currentOverlay = null;
        let currentOverlayName = "";
        let currentOverlayBounds = null;
        let currentOverlayVisible = true;
        let currentOverlayOpacity = 0.85;

        const coverageLayer = L.featureGroup().addTo(map);
        const mapEntries = [];

        let watchId = null;
        let userMarker = null;
        let userAccuracyCircle = null;
        let userPosition = null;
        let userAccuracy = null;
        let userHeading = null;
        let userSpeed = null;
        let isFirstLocationFix = true;
        let isFollowingUser = false;

        let isRecordingTrack = false;
        let trackPoints = [];

        const trackPolyline = L.polyline([], {
            color: "#e74c3c",
            weight: 4,
            opacity: 0.9
        }).addTo(map);

        loadLocalMapCatalog();

        // ==========================================
        // TOOLS PANEL FUNCTIONS
        // ==========================================

        function openToolsPanel() {
            toolsSheet.classList.add("open");
            toolsBackdrop.classList.add("open");
            toolsFab.style.display = "none";
        }

        function closeToolsPanel() {
            toolsSheet.classList.remove("open");
            toolsBackdrop.classList.remove("open");
            toolsFab.style.display = "block";
        }

        // ==========================================
        // LOCAL MAP CATALOG CONTROL FUNCTION
        // ==========================================

        function createLocalMapCatalogControl() {
            const control = L.control({
                position: "topright"
            });

            let container;
            let searchInput;
            let listContainer;
            let entries = [];
            let selectedName = "";

            control.onAdd = function () {
                container = L.DomUtil.create(
                    "div",
                    "leaflet-control local-map-control"
                );

                container.innerHTML = `
                    <button class="local-map-toggle" type="button" title="Local Map Catalog">
                        🗺
                    </button>

                    <div class="local-map-panel">
                        <div class="local-map-header">
                            <span>Local Map Catalog</span>
                            <button class="local-map-close" type="button" title="Close">×</button>
                        </div>

                        <input
                            class="local-map-search"
                            type="search"
                            placeholder="Search local maps..."
                        />

                        <div class="local-map-list">
                            <div class="local-map-empty">Loading maps...</div>
                        </div>
                    </div>
                `;

                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.disableScrollPropagation(container);

                const toggleButton = container.querySelector(".local-map-toggle");
                const closeButton = container.querySelector(".local-map-close");
                searchInput = container.querySelector(".local-map-search");
                listContainer = container.querySelector(".local-map-list");

                toggleButton.addEventListener("click", function () {
                    container.classList.add("expanded");
                    searchInput.focus();
                });

                closeButton.addEventListener("click", function () {
                    container.classList.remove("expanded");
                });

                searchInput.addEventListener("input", function () {
                    renderList(searchInput.value);
                });

                return container;
            };

            control.setEntries = function (newEntries) {
                entries = [...newEntries].sort((a, b) =>
                    a.baseName.localeCompare(b.baseName)
                );

                renderList(searchInput ? searchInput.value : "");
            };

            control.setSelected = function (baseName) {
                selectedName = baseName;
                renderList(searchInput ? searchInput.value : "");
            };

            function renderList(filterText) {
                if (!listContainer) {
                    return;
                }

                const normalizedFilter = String(filterText || "").toLowerCase();

                const filteredEntries = entries.filter((entry) =>
                    entry.baseName.toLowerCase().includes(normalizedFilter)
                );

                if (filteredEntries.length === 0) {
                    listContainer.innerHTML = `
                        <div class="local-map-empty">
                            No maps found.
                        </div>
                    `;
                    return;
                }

                const fragment = document.createDocumentFragment();

                filteredEntries.forEach((entry) => {
                    const label = document.createElement("label");
                    label.className = "local-map-item";

                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "local-map-selection";
                    radio.checked = entry.baseName === selectedName;

                    const span = document.createElement("span");
                    span.textContent = entry.baseName;

                    label.appendChild(radio);
                    label.appendChild(span);

                    label.addEventListener("click", function () {
                        openMapEntry(entry, {
                            zoomToMap: true
                        });

                        selectedName = entry.baseName;
                        renderList(searchInput.value);

                        if (isMobile) {
                            container.classList.remove("expanded");
                        }
                    });

                    fragment.appendChild(label);
                });

                listContainer.innerHTML = "";
                listContainer.appendChild(fragment);
            }

            return control;
        }

        // ==========================================
        // LOAD LOCAL MAP CATALOG
        // ==========================================

        async function loadLocalMapCatalog() {
            try {
                const response = await fetch("maps.json");

                if (!response.ok) {
                    throw new Error("Could not load maps.json");
                }

                const mapCatalog = await response.json();
                const entries = Object.entries(mapCatalog);
                let validPairsCount = 0;

                if (entries.length === 0) {
                    updateStatus("No map entries found in maps.json.", "#e67e22");
                    localMapCatalogControl.setEntries([]);
                    return;
                }

                for (let index = 0; index < entries.length; index++) {
                    const [baseName, entry] = entries[index];

                    updateStatus(
                        `Loading maps: ${index + 1} / ${entries.length}`,
                        "#2980b9"
                    );

                    const mapFileName = entry.map;
                    const jpgFileName = entry.jpg;

                    if (!mapFileName || !jpgFileName) {
                        console.warn("Skipping invalid catalog entry:", baseName);
                        continue;
                    }

                    try {
                        const mapResponse = await fetch(mapFileName);

                        if (!mapResponse.ok) {
                            console.warn("Could not load map file:", mapFileName);
                            continue;
                        }

                        const mapText = await mapResponse.text();
                        const bounds = parseMapFile(mapText);

                        if (bounds) {
                            drawCoverageArea(baseName, jpgFileName, bounds);
                            validPairsCount++;
                        }
                    } catch (error) {
                        console.warn("Failed to process map:", baseName, error);
                    }
                }

                localMapCatalogControl.setEntries(mapEntries);

                if (validPairsCount > 0) {
                    updateStatus(
                        `Loaded ${validPairsCount} maps. Choose one from 🗺 Local Map Catalog.`,
                        "#2980b9"
                    );

                    map.fitBounds(coverageLayer.getBounds(), {
                        padding: [24, 24]
                    });

                    updateCoverageStylesByZoom();
                } else {
                    updateStatus(
                        "No valid map pairs found in this folder.",
                        "#e67e22"
                    );
                }
            } catch (error) {
                console.error(error);
                updateStatus(
                    "Error: Make sure the Python server is running!",
                    "red"
                );
            }
        }

        // ==========================================
        // LOCAL MAP FUNCTIONS
        // ==========================================

        function parseMapFile(text) {
            const regex = /MMPLL,\s*\d+,\s*([\d.-]+),\s*([\d.-]+)/g;
            let match;
            const lats = [];
            const lons = [];

            while ((match = regex.exec(text)) !== null) {
                const lon = Number.parseFloat(match[1]);
                const lat = Number.parseFloat(match[2]);

                if (Number.isFinite(lat) && Number.isFinite(lon)) {
                    lons.push(lon);
                    lats.push(lat);
                }
            }

            if (lats.length < 2 || lons.length < 2) {
                return null;
            }

            return [
                [Math.min(...lats), Math.min(...lons)],
                [Math.max(...lats), Math.max(...lons)]
            ];
        }

        function drawCoverageArea(baseName, jpgFileName, bounds) {
            const rect = L.rectangle(bounds, {
                color: "#2980b9",
                weight: 2,
                fillColor: "#3498db",
                fillOpacity: 0.08
            });

            const entry = {
                baseName,
                jpgFileName,
                bounds,
                rect
            };

            mapEntries.push(entry);

            rect.on("click", function () {
                openMapEntry(entry, {
                    zoomToMap: false
                });
            });

            rect.bindTooltip(baseName, {
                sticky: true
            });

            coverageLayer.addLayer(rect);
        }

        function openMapEntry(entry, options = {}) {
            const shouldZoomToMap = options.zoomToMap === true;

            if (currentOverlay) {
                map.removeLayer(currentOverlay);
            }

            currentOverlayName = entry.baseName;
            currentOverlayBounds = entry.bounds;
            currentOverlayVisible = true;

            currentOverlay = L.imageOverlay(entry.jpgFileName, entry.bounds, {
                opacity: currentOverlayOpacity,
                interactive: true
            }).addTo(map);

            currentOverlay.bringToFront();
            entry.rect.bringToFront();

            overlayBtn.disabled = false;
            overlayBtn.innerText = "🗺 Hide Map";
            opacityWrapper.style.display = "block";

            localMapCatalogControl.setSelected(entry.baseName);

            if (shouldZoomToMap) {
                map.fitBounds(entry.bounds, {
                    padding: [24, 24]
                });
            }

            updateStatus(`Viewing: ${entry.baseName}`, "#2980b9");
        }

        function toggleCurrentOverlayVisibility() {
            if (!currentOverlay || !currentOverlayBounds || !currentOverlayName) {
                return;
            }

            if (currentOverlayVisible) {
                map.removeLayer(currentOverlay);
                currentOverlayVisible = false;
                overlayBtn.innerText = "🗺 Show Map";
                updateStatus(`Hidden: ${currentOverlayName}`, "#34495e");
            } else {
                currentOverlay.addTo(map);
                currentOverlay.setOpacity(currentOverlayOpacity);
                currentOverlay.bringToFront();
                currentOverlayVisible = true;
                overlayBtn.innerText = "🗺 Hide Map";
                updateStatus(`Viewing: ${currentOverlayName}`, "#2980b9");
            }
        }

        function updateCoverageStylesByZoom() {
            const zoom = map.getZoom();

            let weight = 1;
            let fillOpacity = 0.03;

            if (zoom >= 9 && zoom < 12) {
                weight = 1.5;
                fillOpacity = 0.06;
            } else if (zoom >= 12) {
                weight = 2;
                fillOpacity = 0.1;
            }

            coverageLayer.eachLayer((layer) => {
                if (layer.setStyle) {
                    layer.setStyle({
                        weight,
                        fillOpacity
                    });
                }
            });
        }

        // ==========================================
        // GPS FUNCTIONS
        // ==========================================

        function toggleGPS() {
            if (watchId !== null) {
                stopGPS();
                return;
            }

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            gpsBtn.innerText = "🔄 Locating...";
            gpsBtn.style.backgroundColor = "#e67e22";

            const geoOptions = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                onLocationSuccess,
                onLocationError,
                geoOptions
            );
        }

        function stopGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }

            if (userAccuracyCircle) {
                map.removeLayer(userAccuracyCircle);
                userAccuracyCircle = null;
            }

            userPosition = null;
            userAccuracy = null;
            userHeading = null;
            userSpeed = null;
            isFirstLocationFix = true;

            setFollowMode(false);

            gpsBtn.innerText = "📍 Find My Location";
            gpsBtn.style.backgroundColor = "#2ecc71";

            followBtn.disabled = true;
            nearestBtn.disabled = true;
            trackBtn.disabled = true;

            gpsInfoEl.style.display = "none";
            gpsInfoEl.innerText = "";

            if (isRecordingTrack) {
                stopTrackRecording();
            }
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const heading = position.coords.heading;
            const speed = position.coords.speed;
            const timestamp = position.timestamp;
            const latlng = [lat, lon];

            userPosition = {
                lat,
                lon,
                timestamp
            };

            userAccuracy = Number.isFinite(accuracy) ? accuracy : null;
            userHeading = Number.isFinite(heading) ? heading : null;
            userSpeed = Number.isFinite(speed) ? speed : null;

            gpsBtn.innerText = "🛑 Stop Tracking";
            gpsBtn.style.backgroundColor = "#e74c3c";

            followBtn.disabled = false;
            nearestBtn.disabled = false;
            trackBtn.disabled = false;

            updateUserLocationMarker(latlng, accuracy, heading);
            updateGpsInfo();

            if (isRecordingTrack) {
                addTrackPoint(lat, lon, timestamp);
            }

            if (isFirstLocationFix) {
                map.flyTo(latlng, 16);
                isFirstLocationFix = false;
            } else if (isFollowingUser) {
                map.panTo(latlng, {
                    animate: true,
                    duration: 0.5
                });
            }
        }

        function updateUserLocationMarker(latlng, accuracy, heading) {
            const headingDegrees = Number.isFinite(heading) ? heading : 0;

            const icon = L.divIcon({
                className: "",
                html: `
                    <div class="user-heading-marker" style="transform: rotate(${headingDegrees}deg);">
                        <div class="user-heading-arrow"></div>
                        <div class="user-heading-dot"></div>
                    </div>
                `,
                iconSize: [32, 32],
                iconAnchor: [16, 20]
            });

            if (userMarker && userAccuracyCircle) {
                userMarker.setLatLng(latlng);
                userMarker.setIcon(icon);
                userAccuracyCircle.setLatLng(latlng);
                userAccuracyCircle.setRadius(Number.isFinite(accuracy) ? accuracy : 0);
            } else {
                userMarker = L.marker(latlng, {
                    icon
                }).addTo(map).bindPopup("You are here");

                userAccuracyCircle = L.circle(latlng, {
                    radius: Number.isFinite(accuracy) ? accuracy : 0,
                    color: "#1abc9c",
                    fillColor: "#1abc9c",
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
            }

            userMarker.setZIndexOffset(1000);
            userAccuracyCircle.bringToFront();
        }

        function updateGpsInfo() {
            if (!userPosition) {
                gpsInfoEl.style.display = "none";
                gpsInfoEl.innerText = "";
                return;
            }

            const accuracyText = userAccuracy !== null
                ? `±${Math.round(userAccuracy)} m`
                : "unknown";

            const headingText = userHeading !== null
                ? `${Math.round(userHeading)}°`
                : "unknown";

            const speedText = userSpeed !== null
                ? `${(userSpeed * 3.6).toFixed(1)} km/h`
                : "unknown";

            const trackText = isRecordingTrack
                ? `Recording: ${trackPoints.length} points`
                : `Track points: ${trackPoints.length}`;

            gpsInfoEl.style.display = "block";
            gpsInfoEl.innerText =
                `GPS accuracy: ${accuracyText} | Heading: ${headingText} | Speed: ${speedText}\n${trackText}`;
        }

        function onLocationError(error) {
            console.error(error);

            let msg = "Unable to retrieve your location.";

            if (error.code === 1) {
                msg = "Permission denied. Please allow location access in your browser settings.";
            } else if (error.code === 2) {
                msg = "Position unavailable. Ensure your device GPS is turned on.";
            } else if (error.code === 3) {
                msg = "Location request timed out.";
            }

            alert(msg);
            stopGPS();
        }

        // ==========================================
        // FOLLOW MODE
        // ==========================================

        function toggleFollowMode() {
            setFollowMode(!isFollowingUser);
        }

        function setFollowMode(enabled) {
            isFollowingUser = enabled;

            if (enabled) {
                followBtn.classList.add("active");
                followBtn.innerText = "🧭 Follow: On";

                if (userPosition) {
                    map.panTo([userPosition.lat, userPosition.lon]);
                }
            } else {
                followBtn.classList.remove("active");
                followBtn.innerText = "🧭 Follow: Off";
            }
        }

        // ==========================================
        // NEAREST LOCAL MAP
        // ==========================================

        function openNearestMapToUser() {
            if (!userPosition) {
                alert("Start GPS first so the app knows your location.");
                return;
            }

            if (mapEntries.length === 0) {
                alert("No local maps are loaded yet.");
                return;
            }

            const userLatLng = L.latLng(userPosition.lat, userPosition.lon);

            let containingEntry = null;
            let nearestEntry = null;
            let nearestDistance = Infinity;

            for (const entry of mapEntries) {
                const bounds = L.latLngBounds(entry.bounds);

                if (bounds.contains(userLatLng)) {
                    containingEntry = entry;
                    break;
                }

                const center = bounds.getCenter();
                const distance = userLatLng.distanceTo(center);

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestEntry = entry;
                }
            }

            const selectedEntry = containingEntry || nearestEntry;

            if (!selectedEntry) {
                alert("Could not determine the nearest map.");
                return;
            }

            openMapEntry(selectedEntry, {
                zoomToMap: true
            });

            if (containingEntry) {
                updateStatus(
                    `Opened map containing your location: ${selectedEntry.baseName}`,
                    "#2980b9"
                );
            } else {
                updateStatus(
                    `Opened nearest map: ${selectedEntry.baseName} (${Math.round(nearestDistance)} m from center)`,
                    "#2980b9"
                );
            }
        }

        // ==========================================
        // TRACK RECORDING
        // ==========================================

        function toggleTrackRecording() {
            if (isRecordingTrack) {
                stopTrackRecording();
            } else {
                startTrackRecording();
            }
        }

        function startTrackRecording() {
            if (!userPosition) {
                alert("Start GPS first before recording a track.");
                return;
            }

            isRecordingTrack = true;
            trackBtn.innerText = "⏹ Stop Track";
            trackBtn.style.backgroundColor = "#c0392b";

            addTrackPoint(userPosition.lat, userPosition.lon, userPosition.timestamp);

            updateGpsInfo();
            updateStatus("Track recording started.", "#e67e22");
        }

        function stopTrackRecording() {
            isRecordingTrack = false;
            trackBtn.innerText = "▶ Start Track";
            trackBtn.style.backgroundColor = "#e67e22";

            if (trackPoints.length > 0) {
                exportBtn.disabled = false;
            }

            updateGpsInfo();
            updateStatus(
                `Track recording stopped. ${trackPoints.length} points saved.`,
                "#16a085"
            );
        }

        function addTrackPoint(lat, lon, timestamp) {
            const lastPoint = trackPoints[trackPoints.length - 1];

            if (lastPoint) {
                const lastLatLng = L.latLng(lastPoint.lat, lastPoint.lon);
                const currentLatLng = L.latLng(lat, lon);
                const distance = lastLatLng.distanceTo(currentLatLng);

                if (distance < 2) {
                    return;
                }
            }

            const point = {
                lat,
                lon,
                time: new Date(timestamp || Date.now()).toISOString()
            };

            trackPoints.push(point);
            trackPolyline.addLatLng([lat, lon]);

            exportBtn.disabled = trackPoints.length === 0;
            updateGpsInfo();
        }

        function exportGPX() {
            if (trackPoints.length === 0) {
                alert("No track points to export.");
                return;
            }

            const gpx = buildGPX(trackPoints);
            const blob = new Blob([gpx], {
                type: "application/gpx+xml;charset=utf-8"
            });

            const timestamp = new Date()
                .toISOString()
                .replaceAll(":", "-")
                .replaceAll(".", "-");

            const fileName = `gps-track-${timestamp}.gpx`;
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            updateStatus(`Exported GPX: ${fileName}`, "#16a085");
        }

        function buildGPX(points) {
            const trackName = `GPS Track ${new Date().toISOString()}`;

            const trkpts = points.map((point) => {
                return `      <trkpt lat="${point.lat}" lon="${point.lon}">
        <time>${point.time}</time>
      </trkpt>`;
            }).join("\n");

            return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1"
     creator="Mobile Topo Viewer"
     xmlns="http://www.topografix.com/GPX/1/1"
     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
     xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>${escapeXml(trackName)}</name>
    <time>${new Date().toISOString()}</time>
  </metadata>
  <trk>
    <name>${escapeXml(trackName)}</name>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>`;
        }

        // ==========================================
        // HELPERS
        // ==========================================

        function updateStatus(message, color) {
            statusEl.innerText = message;

            if (color) {
                statusEl.style.color = color;
            }
        }

        function escapeXml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&apos;");
        }
    </script>
</body>
