<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Auto-Loading Topo Viewer with GPS</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            left: 50px;
            top: 10px;
            z-index: 1000;
            width: 300px;
            max-width: calc(100vw - 90px);
            background: rgba(255, 255, 255, 0.96);
            padding: 14px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(6px);
        }

        #ui-container strong {
            font-size: 15px;
            color: #111;
        }

        #status {
            font-weight: bold;
            color: #2980b9;
            font-size: 13px;
            line-height: 1.35;
        }

        .gps-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 11px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 100%;
            min-height: 44px;
            touch-action: manipulation;
        }

        .gps-btn:hover {
            background-color: #27ae60;
        }

        .gps-btn:active {
            background-color: #1e8449;
            transform: scale(0.98);
        }

        .leaflet-control-layers {
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.25);
            font-size: 14px;
        }

        .leaflet-control-zoom a {
            width: 34px;
            height: 34px;
            line-height: 34px;
        }

        @media (max-width: 700px) {
            #ui-container {
                top: auto;
                left: 50%;
                bottom: 16px;
                transform: translateX(-50%);
                width: calc(100vw - 28px);
                max-width: 420px;
                padding: 12px;
                border-radius: 16px;
            }

            #ui-container strong {
                font-size: 14px;
            }

            #status {
                font-size: 12px;
            }

            .gps-btn {
                font-size: 15px;
                min-height: 48px;
                border-radius: 12px;
            }

            .leaflet-top.leaflet-right {
                top: 8px;
                right: 8px;
            }

            .leaflet-control-layers {
                max-width: calc(100vw - 80px);
                font-size: 13px;
            }

            .leaflet-control-zoom {
                margin-top: 8px;
                margin-left: 8px;
            }
        }
    </style>
</head>

<body>
    <div id="ui-container">
        <div><strong>Local Map Catalog</strong></div>
        <div id="status">Connecting to folder...</div>
        <button class="gps-btn" id="gpsBtn" type="button" onclick="toggleGPS()">
            📍 Find My Location
        </button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // MAP INITIALIZATION
        // ==========================================

        const map = L.map("map", {
            zoomControl: false
        }).setView([0, 0], 2);

        L.control.zoom({
            position: "topleft"
        }).addTo(map);

        // ==========================================
        // BASE MAP OPTIONS
        // ==========================================

        const osmStandard = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "© OpenStreetMap contributors"
            }
        );

        const osmHot = L.tileLayer(
            "https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution:
                    "© OpenStreetMap contributors, Tiles style by Humanitarian OpenStreetMap Team"
            }
        );

        const openTopoMap = L.tileLayer(
            "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 17,
                attribution:
                    "© OpenStreetMap contributors, SRTM | Map style: © OpenTopoMap"
            }
        );

        const baseMaps = {
            "OpenStreetMap Standard": osmStandard,
            "OpenStreetMap HOT": osmHot,
            "OpenStreetMap Outdoor / Topographic": openTopoMap
        };

        osmStandard.addTo(map);

        const isMobile = window.matchMedia("(max-width: 700px)").matches;

        L.control.layers(baseMaps, null, {
            collapsed: isMobile,
            position: "topright"
        }).addTo(map);

        // ==========================================
        // LOCAL MAP CATALOG VARIABLES
        // ==========================================

        let currentOverlay = null;
        const coverageLayer = L.featureGroup().addTo(map);

        // ==========================================
        // GPS VARIABLES
        // ==========================================

        let watchId = null;
        let userMarker = null;
        let userAccuracyCircle = null;
        let isFirstLocationFix = true;

        // ==========================================
        // LOAD LOCAL MAP CATALOG
        // ==========================================

        fetch("maps.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Could not load maps.json");
                }

                return response.json();
            })
            .then(async (mapCatalog) => {
                let validPairsCount = 0;

                for (const baseName in mapCatalog) {
                    if (!Object.prototype.hasOwnProperty.call(mapCatalog, baseName)) {
                        continue;
                    }

                    const mapFileName = mapCatalog[baseName].map;
                    const jpgFileName = mapCatalog[baseName].jpg;

                    if (!mapFileName || !jpgFileName) {
                        console.warn("Skipping invalid catalog entry:", baseName);
                        continue;
                    }

                    try {
                        const mapResponse = await fetch(mapFileName);

                        if (!mapResponse.ok) {
                            console.warn("Could not load map file:", mapFileName);
                            continue;
                        }

                        const mapText = await mapResponse.text();
                        const bounds = parseMapFile(mapText);

                        if (bounds) {
                            drawCoverageArea(baseName, jpgFileName, bounds);
                            validPairsCount++;
                        }
                    } catch (error) {
                        console.warn("Failed to process map:", baseName, error);
                    }
                }

                if (validPairsCount > 0) {
                    updateStatus(
                        `Loaded ${validPairsCount} maps. Click an outline to view!`,
                        "#2980b9"
                    );

                    map.fitBounds(coverageLayer.getBounds(), {
                        padding: [20, 20]
                    });
                } else {
                    updateStatus("No map pairs found in this folder.", "#e67e22");
                }
            })
            .catch((error) => {
                console.error(error);
                updateStatus(
                    "Error: Make sure the Python server is running!",
                    "red"
                );
            });

        // ==========================================
        // HELPERS
        // ==========================================

        function updateStatus(message, color) {
            const status = document.getElementById("status");
            status.innerText = message;

            if (color) {
                status.style.color = color;
            }
        }

        function parseMapFile(text) {
            const regex = /MMPLL,\s*\d+,\s*([\d.-]+),\s*([\d.-]+)/g;
            let match;
            const lats = [];
            const lons = [];

            while ((match = regex.exec(text)) !== null) {
                lons.push(parseFloat(match[1]));
                lats.push(parseFloat(match[2]));
            }

            if (lats.length < 2 || lons.length < 2) {
                return null;
            }

            return [
                [Math.min(...lats), Math.min(...lons)],
                [Math.max(...lats), Math.max(...lons)]
            ];
        }

        function drawCoverageArea(baseName, jpgFileName, bounds) {
            const rect = L.rectangle(bounds, {
                color: "#2980b9",
                weight: 2,
                fillColor: "#3498db",
                fillOpacity: 0.1
            });

            rect.on("mouseover", function () {
                this.setStyle({
                    fillOpacity: 0
                });
            });

            rect.on("mouseout", function () {
                this.setStyle({
                    fillOpacity: 0.1
                });
            });

            rect.on("click", function () {
                if (currentOverlay) {
                    map.removeLayer(currentOverlay);
                }

                updateStatus(`Viewing: ${baseName}`, "#2980b9");

                currentOverlay = L.imageOverlay(jpgFileName, bounds, {
                    opacity: 0.85,
                    interactive: true
                }).addTo(map);

                currentOverlay.bringToFront();
                rect.bringToFront();
            });

            rect.bindTooltip(baseName, {
                sticky: true
            });

            coverageLayer.addLayer(rect);
        }

        // ==========================================
        // GPS FUNCTIONALITY
        // ==========================================

        function toggleGPS() {
            const btn = document.getElementById("gpsBtn");

            if (watchId !== null) {
                stopGPS();
                return;
            }

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            btn.innerText = "🔄 Locating...";
            btn.style.backgroundColor = "#e67e22";

            const geoOptions = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                onLocationSuccess,
                onLocationError,
                geoOptions
            );
        }

        function stopGPS() {
            const btn = document.getElementById("gpsBtn");

            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (userMarker) {
                map.removeLayer(userMarker);
                userMarker = null;
            }

            if (userAccuracyCircle) {
                map.removeLayer(userAccuracyCircle);
                userAccuracyCircle = null;
            }

            btn.innerText = "📍 Find My Location";
            btn.style.backgroundColor = "#2ecc71";
            isFirstLocationFix = true;
        }

        function onLocationSuccess(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const latlng = [lat, lon];

            const btn = document.getElementById("gpsBtn");
            btn.innerText = "🛑 Stop Tracking";
            btn.style.backgroundColor = "#e74c3c";

            if (userMarker && userAccuracyCircle) {
                userMarker.setLatLng(latlng);
                userAccuracyCircle.setLatLng(latlng);
                userAccuracyCircle.setRadius(accuracy);
            } else {
                userMarker = L.marker(latlng)
                    .addTo(map)
                    .bindPopup("You are here")
                    .openPopup();

                userAccuracyCircle = L.circle(latlng, {
                    radius: accuracy,
                    color: "#1abc9c",
                    fillColor: "#1abc9c",
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
            }

            userMarker.setZIndexOffset(1000);
            userAccuracyCircle.bringToFront();

            if (isFirstLocationFix) {
                map.flyTo(latlng, 16);
                isFirstLocationFix = false;
            }
        }

        function onLocationError(error) {
            console.error(error);

            let msg = "Unable to retrieve your location.";

            if (error.code === 1) {
                msg =
                    "Permission denied. Please allow location access in your browser settings.";
            } else if (error.code === 2) {
                msg =
                    "Position unavailable. Ensure your device GPS is turned on.";
            } else if (error.code === 3) {
                msg = "Location request timed out.";
            }

            alert(msg);
            stopGPS();
        }
    </script>
</body>
</html>
